<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindStream | Archive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 40px 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: #333; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; font-size: 0.9em; transition: 0.3s; }
        .back-btn:hover { background: #555; }
        
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border-left: 5px solid #4a90e2; }
        .original-text { font-size: 0.95em; color: #666; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tasks-box { background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .tasks-box strong { color: #2c3e50; display: block; margin-bottom: 5px; }
        .notes-box { font-style: italic; color: #555; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Your Brain Dumps</h1>
            <a href="/" class="back-btn">← Home</a>
        </div>

        {% for dump in dumps %}
            <div class="card">
                <div class="original-text">{{ dump.content }}</div>
                <div class="tasks-box">
                    <strong>✅ Action Items</strong>
                    {{ dump.tasks }}
                </div>
                <div class="notes-box">
                    <strong>💡 Notes:</strong> {{ dump.notes }}
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
