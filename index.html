<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Dump & Sort</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-btn {
            background-color: #333; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-weight: bold;
            transition: background 0.3s;
            display: inline-block;
        }
        .history-btn:hover { background-color: #555; }
    </style>
</head>
<body>

    <div style="text-align: right; padding: 20px;">
        <a href="/history" class="history-btn">View History Archive</a>
    </div>

    <div class="app-container">
        <h1>Clear Your Mind.</h1>
        <p class="subtitle">Dump all your chaotic thoughts, ideas, and tasks below. We'll sort them out.</p>
        
        <textarea id="mindDumpInput" placeholder="Type absolutely everything on your mind right now..."></textarea>
        
        <button id="dumpBtn" onclick="submitDump()">Clear Screen & Sort</button>

        <div id="resultContainer" class="hidden">
            <div class="output-sections">
                <div class="column">
                    <h3>📝 My Tasks</h3>
                    <div id="tasksList"></div>
                </div>
                <div class="column">
                    <h3>💡 Brain Notes</h3>
                    <div id="notesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function submitDump() {
            const textInput = document.getElementById('mindDumpInput').value;
            if (!textInput.trim()) return alert("Type something first!");

            const button = document.getElementById('dumpBtn');
            button.innerText = "Sorting your brain...";
            button.disabled = true;

            try {
                const response = await fetch('/dump', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textInput })
                });

                const data = await response.json();
                document.getElementById('mindDumpInput').value = '';
                
                const tasksList = document.getElementById('tasksList');
                const notesList = document.getElementById('notesList');
                tasksList.innerHTML = '';
                notesList.innerHTML = '';

                if(data.tasks && data.tasks.length > 0) {
                    data.tasks.forEach(task => {
                        const taskItem = document.createElement('div');
                        taskItem.className = 'task-item';
                        taskItem.innerHTML = `<input type="checkbox"> <label>${task}</label>`;
                        tasksList.appendChild(taskItem);
                    });
                } else {
                    tasksList.innerHTML = '<p class="empty-text">No urgent tasks detected!</p>';
                }

                if(data.notes && data.notes.length > 0) {
                    data.notes.forEach(note => {
                        const noteCard = document.createElement('div');
                        noteCard.className = 'note-card';
                        noteCard.innerText = note;
                        notesList.appendChild(noteCard);
                    });
                } else {
                    notesList.innerHTML = '<p class="empty-text">No scattered notes found.</p>';
                }

                document.getElementById('resultContainer').classList.remove('hidden');

            } catch (error) {
                alert("Something went wrong.");
            } finally {
                button.innerText = "Clear Screen & Sort";
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
